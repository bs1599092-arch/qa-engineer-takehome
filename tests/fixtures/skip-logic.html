<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Student Interests & Hobbies</title></head>
<body>
  <main>
    <h1>Student Interests &amp; Hobbies</h1>
    <form>
      <label for="q_3">Do you have a hobby?</label>
      <select id="q_3" name="q_3">
        <option value="">Select</option><option value="Yes">Yes</option><option value="No">No</option>
      </select>

      <section id="q_4_container" hidden>
        <label for="q_4">What is your hobby?</label>
        <input id="q_4" name="q_4" type="text">
      </section>
    </form>
  </main>
  <script>
    const trigger = document.querySelector('#q_3');
    const followUp = document.querySelector('#q_4_container');
    trigger.addEventListener('change', () => {
      followUp.hidden = trigger.value !== 'Yes';
      if (followUp.hidden) document.querySelector('#q_4').value = '';
    });
  </script>
</body>
</html>
